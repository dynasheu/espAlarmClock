<html>
    <head>
        <style>
            .toggler {
                display: flex;
                flex-direction: row;
                justify-content: space-between;

                label {
                    width: 100%;
                    cursor: pointer;
                }

                input[type=checkbox] {
                    -webkit-appearance: none;
                    -moz-appearance: none;
                    appearance: none;
                    -webkit-tap-highlight-color: transparent;
                    cursor: pointer;
                }

                input[type=checkbox]:focus {
                    outline: 0;
                }

                .toggle {
                height: 28px;
                width: 48px;
                border-radius: 10px;
                /* display: inline-block; */
                position: relative;
                margin: 0;
                border: 2px solid #474755;
                transition: all 0.2s ease;
                flex-shrink: 0;
                }

                .toggle:after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 20px;
                height: 20px;
                border-radius: 6px;
                background: white;
                transition: all 0.2s cubic-bezier(0.5, 0.1, 0.75, 1.35);
                }
                /* .toggle:checked {
                border-color: #654FEC;
                } */

                .toggle:checked:after {
                transform: translatex(20px);
                background: green;
                }

            }
            label {
                color: white;
            }
            body{
                background: black;
            }
        </style>
    </head>
    <body>
                        <div class="toggler">
                    <label for="testslider">test</label>
                    <input id="testslider" type="checkbox" class="toggle" checked>
                </div>
    </body>
</html>
