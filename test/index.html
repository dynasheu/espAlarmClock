<!DOCTYPE html>
<html>
    <head>
        <title>espAlarmClock</title>
        <style>
            :root {
                /* will work on this later */
                --border-color: #833AB4;
                --border-width: 3px;
            }

            h1 {
                color: #833AB4;
                text-align: center;
                font-size: 18px;
                font-weight: 700;
                padding: 0.5em;
                margin: 0 0 0.5em 0;
            }

            .section {
                color: #000000;
                background-color: #222;
                border: 3px solid #833AB4;
                padding: 0.75em;
                margin: 0;
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
                border-radius: 10px;
                margin-bottom: 1em;
                color: #FFFFFF;
            }

            label {
                padding: 0.25em;
            }

            input[type=text], 
            input[type=number], 
            input[type=url], 
            input[type=password], 
            input[type=time], 
            select {
                width: 100%;
                background-color: #333333;
                color: white;
                padding: 0.5em 0.5em;
                display: inline-block;
                border: 2px solid #474747;
                border-radius: 5px;
            }

            input[type=time] {
                text-align: center;
            }
            
            .button {
                background: #833AB4;
                background: linear-gradient(80deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
                animation: ScrollBackground 10s ease infinite;
                background-size: 300% 300%;
                border-radius: 10px;
                padding: 3px;
                margin-bottom: 2em;
                margin-left: auto;
                margin-right: auto;
                width: 80%;
                align-items: center;
                input[type=submit] {
                    width: 100%;
                    background-color:#202020;
                    border: 0;
                    border-radius: 7px;
                    color: #833AB4;
                    cursor: pointer;
                    padding: 0.5em;
                    font-size: 1em;
                    font-weight: 700;
                    &:hover {
                        background-color: rgba(0, 0, 0, 0);
                        color: #FFFFFF;
                    }
                    &:active {
                        background-color: #222;
                        color:#833AB4;
                    }
                }
            }

            @keyframes ScrollBackground {
                0%{background-position: 0% 50%;}
                50%{background-position: 100% 50%;}
                100%{background-position: 0% 50%;}
            }

            .toggler:not(:first-child) {
                margin-top: 10px;

            }

            .toggler {
                display: flex;
                flex-direction: row;
                justify-content: space-between;

                label {
                    width: 100%;
                    cursor: pointer;
                }

                input[type=checkbox] {
                    -webkit-appearance: none;
                    -moz-appearance: none;
                    appearance: none;
                    -webkit-tap-highlight-color: transparent;
                    cursor: pointer;
                }

                input[type=checkbox]:focus {
                    outline: 0;
                }

                .toggle {
                height: 28px;
                width: 48px;
                border-radius: 6px;
                display: inline-block;
                position: relative;
                margin: 0;
                border: 2px solid #474747;
                transition: all 0.2s ease;
                flex-shrink: 0;
                background: #333333;
                }

                .toggle:after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 20px;
                height: 20px;
                border-radius: 3px;
                background: #FFFFFF;
                transition: all 0.2s cubic-bezier(0.5, 0.1, 0.75, 1.35);
                flex-shrink: 0;
                }
                /* .toggle:checked {
                border-color: #654FEC;
                } */

                .toggle:checked:after {
                transform: translatex(20px);
                background: #86d993;
                }

                /* copied from https://codepen.io/avstorm/pen/jOEpBLW */
            }

            .slider {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                margin-top: 10px;

                input[type="range"] {
                    -webkit-appearance: none;
                    background: #333333;
                    border: 2px solid #474747;
                    border-radius: 6px;
                    height: 28px;
                    margin: 0;
                    padding-left: 2px;
                    padding-right: 2px; 
                }

                input[type="range"]::-moz-range-thumb {
                    width: 20px;
                    height: 20px;
                    border-radius: 3px;
                    top: 2px;
                    border: 0;
                    background: #FFFFFF;
                }

                input[type="range"]::-webkit-slider-thumb {
                    -webkit-appearance: none;
                    width: 20px;
                    height: 20px;
                    border-radius: 3px;
                    top: 2px;
                    border: 0;
                    background: #FFFFFF;
                }
            }

            .week {
                display: flex;
                flex-direction: row;
                gap: 10px;
                margin-top: 10px;
            }
            .day {
                flex-grow: 1;

                label {
                    /* width: 50px; */
                    height: 28px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;
                    border-radius: 6px;
                    border: 2px solid #474747;
                    outline: 2px solid #333333;
                    outline-offset: -4px;
                    /* background: #d98986; */
                    background: #333333;
                    color: #FFFFFF;
                    font-weight: 500;
                    transition: all 0.2s ease;
                }

                input:checked + label {
                    background: #86d993;
                    color: #333333;
                }

                input[type="checkbox"] {
                    display: none;
                }
            }

            html {
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }

            * {
                box-sizing: inherit;
                &:before,
                &:after {
                    box-sizing: inherit;
                }
            }

            body {
                background: repeating-linear-gradient(
                    -45deg,
                    #202020,
                    #202020 6px,
                    #222 6px,
                    #222 20px
                    );
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                justify-content: center;
                padding: 0;
                margin: 0;
                .wrapper {
                    width: 600px;
                    min-width: 300px;
                    max-width: 600px;
                    flex-shrink: 0;
                    /* display: flex;
                    flex-direction: column;
                    justify-content: center; */
                    
                }
            }

        </style>
        <script>
            function toggle(id) {
                var ele = document.getElementById(id);
                if (ele)
                  ele.style.display = ele.style.display === "none" ? "flex" : "none";

            }
        </script>
    </head>
    <body>
        <div class="wrapper">
        <h1>espAlarmClock</h1>
        <form action="/save">
            <div class="section">
                <label for="timezone">Time zone</label>
                <select id="timezone" name="timezone">
                    <option value="-12">(GMT -12:00) Eniwetok, Kwajalein</option>
                    <option value="-11">(GMT -11:00) Midway Island, Samoa</option>
                    <option value="-10">(GMT -10:00) Hawaii</option>
                    <option value="-9.5">(GMT -9:30) Taiohae</option>
                    <option value="-9">(GMT -9:00) Alaska</option>
                    <option value="-8">(GMT -8:00) Pacific Time (US &amp; Canada)</option>
                    <option value="-7">(GMT -7:00) Mountain Time (US &amp; Canada)</option>
                    <option value="-6">(GMT -6:00) Central Time (US &amp; Canada), Mexico City</option>
                    <option value="-5">(GMT -5:00) Eastern Time (US &amp; Canada), Bogota, Lima</option>
                    <option value="-4.5">(GMT -4:30) Caracas</option>
                    <option value="-4">(GMT -4:00) Atlantic Time (Canada), Caracas, La Paz</option>
                    <option value="-3.5">(GMT -3:30) Newfoundland</option>
                    <option value="-3">(GMT -3:00) Brazil, Buenos Aires, Georgetown</option>
                    <option value="-2">(GMT -2:00) Mid-Atlantic</option>
                    <option value="-1">(GMT -1:00) Azores, Cape Verde Islands</option>
                    <option value="0" selected="selected">(GMT) Western Europe Time, London, Lisbon, Casablanca</option>
                    <option value="1">(GMT +1:00) Brussels, Copenhagen, Madrid, Paris</option>
                    <option value="2">(GMT +2:00) Kaliningrad, South Africa</option>
                    <option value="3">(GMT +3:00) Baghdad, Riyadh, Moscow, St. Petersburg</option>
                    <option value="3.5">(GMT +3:30) Tehran</option>
                    <option value="4">(GMT +4:00) Abu Dhabi, Muscat, Baku, Tbilisi</option>
                    <option value="4.5">(GMT +4:30) Kabul</option>
                    <option value="5">(GMT +5:00) Ekaterinburg, Islamabad, Karachi, Tashkent</option>
                    <option value="5.5">(GMT +5:30) Bombay, Calcutta, Madras, New Delhi</option>
                    <option value="5.75">(GMT +5:45) Kathmandu, Pokhara</option>
                    <option value="6">(GMT +6:00) Almaty, Dhaka, Colombo</option>
                    <option value="6.5">(GMT +6:30) Yangon, Mandalay</option>
                    <option value="7">(GMT +7:00) Bangkok, Hanoi, Jakarta</option>
                    <option value="8">(GMT +8:00) Beijing, Perth, Singapore, Hong Kong</option>
                    <option value="8.75">(GMT +8:45) Eucla</option>
                    <option value="9">(GMT +9:00) Tokyo, Seoul, Osaka, Sapporo, Yakutsk</option>
                    <option value="9.5">(GMT +9:30) Adelaide, Darwin</option>
                    <option value="10">(GMT +10:00) Eastern Australia, Guam, Vladivostok</option>
                    <option value="10.5">(GMT +10:30) Lord Howe Island</option>
                    <option value="11">(GMT +11:00) Magadan, Solomon Islands, New Caledonia</option>
                    <option value="11.5">(GMT +11:30) Norfolk Island</option>
                    <option value="12">(GMT +12:00) Auckland, Wellington, Fiji, Kamchatka</option>
                    <option value="12.75">(GMT +12:45) Chatham Islands</option>
                    <option value="13">(GMT +13:00) Apia, Nukualofa</option>
                    <option value="14">(GMT +14:00) Line Islands, Tokelau</option>
                </select>
                <div class="toggler">
                    <label for="dst">Daylight savings time</label>
                    <input id="dst" type="checkbox" class="toggle" name="dst" checked>
                </div>
                <label for="clock_format">Clock format</label>
                <select id="clock_format" name="clock_format">
                    <option value="0">24-Hour</option>
                    <option value="1">12-Hour</option>
                </select>
                <div class="toggler">
                    <label for="auto_brightnes">Automatic brightness</label>
                    <input id="auto_brightnes" type="checkbox" class="toggle" name="auto_brightnes" onclick="toggle('brightness_slider')">
                </div>
                <div class="slider" id="brightness_slider">
                    <label for="brightness">Brightness Level</label>
                    <input  id="brightness" type="range" name="brightness" min="0" max="15" value="10">
                </div>

            </div>
            
            <div class="section">
                <div class="toggler">
                    <label for="alarm1_on">Alarm 1</label>
                    <input id="alarm1_on" type="checkbox" class="toggle" name="alarm1_on">
                </div>
                <label for="alarm1_time">Alarm time</label>
                <input id="alarm1_time" type="time" name="alarm1_time">

                <div class="week">
                    <div class="day">
                        <input id="alarm1_mon" type="checkbox" name="alarm1_mon" checked>
                        <label for="alarm1_mon">M</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_tue" type="checkbox" name="alarm1_tue" checked>
                        <label for="alarm1_tue">T</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_wed" type="checkbox" name="alarm1_wed" checked>
                        <label for="alarm1_wed">W</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_thu" type="checkbox" name="alarm1_thu" checked>
                        <label for="alarm1_thu">T</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_fri" type="checkbox" name="alarm1_fri" checked>
                        <label for="alarm1_fri">F</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_sat" type="checkbox" name="alarm1_sat" checked>
                        <label for="alarm1_sat">S</label>
                    </div>
                    <div class="day">
                        <input id="alarm1_sun" type="checkbox" name="alarm1_sun" checked>
                        <label for="alarm1_sun">S</label>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="toggler">
                    <label for="alarm2_on">Alarm 2</label>
                    <input id="alarm2_on" type="checkbox" class="toggle" name="alarm2_on">
                </div>
                <label for="alarm2_time">Alarm time</label>
                <input id="alarm2_time" type="time" name="alarm2_time">

                <div class="week">
                    <div class="day">
                        <input id="alarm2_mon" type="checkbox" name="alarm2_mon" checked>
                        <label for="alarm2_mon">M</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_tue" type="checkbox" name="alarm2_tue" checked>
                        <label for="alarm2_tue">T</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_wed" type="checkbox" name="alarm2_wed" checked>
                        <label for="alarm2_wed">W</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_thu" type="checkbox" name="alarm2_thu" checked>
                        <label for="alarm2_thu">T</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_fri" type="checkbox" name="alarm2_fri" checked>
                        <label for="alarm2_fri">F</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_sat" type="checkbox" name="alarm2_sat" checked>
                        <label for="alarm2_sat">S</label>
                    </div>
                    <div class="day">
                        <input id="alarm2_sun" type="checkbox" name="alarm2_sun" checked>
                        <label for="alarm2_sun">S</label>
                    </div>
                </div>
            </div>

            <div class="section">
                <label for="radio_station">Radio station</label>
                <input id="radio_station" type="url" placeholder="Enter radio station url" name="radio_station">
                <label for="radio_timeout">Radio timeout</label>
                <input id="radio_timeout" type="number" min="1" placeholder="Enter positive value in minutes" name="radio_timeout">
            </div>
                
            <div class="section">
                <div class="toggler">
                    <label for="mqtt_on">MQTT support</label>
                    <input id="mqtt_on" type="checkbox" class="toggle" name="mqtt_on">
                </div>
                <label for="mqtt_server">Server</label>
                <input id="mqtt_server" type="text" minlength="7" maxlength="15" size="15" placeholder="Enter MQTT server IP" pattern="^(?>(\d|[1-9]\d{2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(?1)$" name="mqtt_server">
                <label for="mqtt_port">Port</label>
                <input id="mqtt_port" type="number" placeholder="Enter MQTT server port" name="mqtt_port">
                <label for="mqtt_user">username</label>
                <input id="mqtt_user" type="text" placeholder="Enter MQTT username" name="mqtt_user">
                <label for="mqtt_pass">password</label>
                <input id="mqtt_pass" type="password" placeholder="Enter MQTT password" name="mqtt_pass">
                <label for="mqtt_topic">topic</label>
                <input id="mqtt_topic" type="text" placeholder="Enter MQTT topic for communication" name="mqtt_topic">
            </div>
        
            <div class="button">
                <input type="submit" value="Save" />    
            </div>
        </form>
        </div>
    </body>
</html>
