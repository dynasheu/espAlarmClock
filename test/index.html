<html>
    <head>
        <title>espAlarmClock</title>
        <style>
            body {
                background-color: #238580;
                font-family: monospace;
            }
            
            .wrapper {
                min-width: 300px;
                max-width: 500px;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
            }

            h2 {
                background-color: #430d75;
                color: #EB913E;
                text-align: center;
                padding: 0.25em;
                margin-bottom: 0;
                border-top-left-radius: 0.25em;
                border-top-right-radius: 0.25em;
            }

            .section {
                color: #000000;
                background-color: #ED3F42;
                padding: 0.75em;
                border-color: #430d75;
                border-width: 0 0.5em 0.5em 0.5em;
                border-style: solid;
                display: flex;
                flex-direction: column;
                border-bottom-left-radius: 0.5em;
                border-bottom-right-radius: 0.5em;
            }

                        label {
                font-size: 1.5em;
                padding-bottom: 0.5em;
            }


        </style>
    </head>
    <body>
        <h1>espAlarmClock</h1>
        <div class="wrapper">
        <form>
            <div>
                <h2>Clock settings</h2>
                <div class="section">
                    <label>Time zone</label>
                    <input type="number">
                    <input type="checkbox">
                    <label>Daylight savings time</label>
                    <label>Clock format</label>
                    <select>
                        <option>24-Hour</option>
                        <option>12-Hour</option>
                    </select>
                </div>

            </div>

            <div>
                <h2>Alarm settings</h2>
                <div>
                    <h3>Alarm 1</h3>
                    <input type="checkbox">Enable
                    <label>Time</label>
                    <input type="time">
                    <fieldset>
                        <legend>Alarm day</legend>
                        <input type="checkbox">
                        <label>Monday</label>
                        <input type="checkbox">
                        <label>Tuesday</label>
                        <input type="checkbox">
                        <label>Wednesday</label>
                        <input type="checkbox">
                        <label>Thursday</label>
                        <input type="checkbox">
                        <label>Friday</label>
                        <input type="checkbox">
                        <label>Saturday</label>
                        <input type="checkbox">
                        <label>Sunday</label>
                    </fieldset>
                </div>
                <div>
                    <h3>Alarm 2</h3>
                    <input type="checkbox">Enable
                    <label>Time</label>
                    <input type="time">
                    <fieldset>
                        <legend>Alarm day</legend>
                        <input type="checkbox">
                        <label>Monday</label>
                        <input type="checkbox">
                        <label>Tuesday</label>
                        <input type="checkbox">
                        <label>Wednesday</label>
                        <input type="checkbox">
                        <label>Thursday</label>
                        <input type="checkbox">
                        <label>Friday</label>
                        <input type="checkbox">
                        <label>Saturday</label>
                        <input type="checkbox">
                        <label>Sunday</label>
                    </fieldset>
                </div>
            </div>

            <div>
                <h2>Radio station settings</h2>
                <input type="url">
            </div>
            
            <div>
                <h2>MQTT settings</h2>
                <label>Server</label>
                <input type="text" minlength="7" maxlength="15" size="15" pattern="^(?>(\d|[1-9]\d{2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(?1)$">
                <label>Port</label>
                <input type="number">
                <label>username</label>
                <input>
                <label>password</label>
                <input type="password">
                <label>topic</label>
                <input>
            </div>
        </form>

        <input type="submit" value="Save" />
        </div>
    </body>
</html>
