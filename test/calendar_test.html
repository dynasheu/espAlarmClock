<html>
    <head>
        <title>test</title>
        <style>
            body {
                background-color: #222;;
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            .week {
                display: flex;
                flex-direction: row;
                gap: 10px;
                max-width: 600px;
            }
            .day {
                flex-grow: 1;

                label {
                    /* width: 50px; */
                    height: 28px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;
                    border-radius: 6px;
                    border: 2px solid #474747;
                    outline: 2px solid #333333;
                    outline-offset: -4px;
                    background: white;
                    color: black;
                    transition: all 0.2s ease;
                }

                input:checked + label {
                    background: green;
                    color: white;
                }

                input[type="checkbox"] {
                    display: none;
                }
            }


        </style>
    </head>
    <body>
        <div class="week">
            <div class="day">
                <input id="mon1" type="checkbox">
                <label for="mon1">M</label>
            </div>
            <div class="day">
                <input id="tue1" type="checkbox">
                <label for="tue1">T</label>
            </div>
            <div class="day">
                <input id="wed1" type="checkbox">
                <label for="wed1">W</label>
            </div>
            <div class="day">
                <input id="thu1" type="checkbox">
                <label for="thu1">T</label>
            </div>
            <div class="day">
                <input id="fri1" type="checkbox">
                <label for="fri1">F</label>
            </div>
            <div class="day">
                <input id="sat1" type="checkbox">
                <label for="sat1">S</label>
            </div>
            <div class="day">
                <input id="sun1" type="checkbox">
                <label for="sun1">S</label>
            </div>
        </div>
    </body>
</html>
