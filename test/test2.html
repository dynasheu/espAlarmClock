<html>
    <!-- from https://codepen.io/mallendeo/pen/QWKrEL -->
    <head>
        <style>
            html,
            body {
                display: flex;
                min-height: 100%;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                font-family: sans-serif;
            }

            ul,
            li {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .tg-list {
                text-align: center;
                display: flex;
                align-items: center;
            }

            .tg-list-item {
                margin: 0 0.15em;
            }


            .tgl {
                display: none;
            
                &,
                &:after,
                &:before,
                & *,
                & *:after,
                & *:before,
                & + .tgl-btn {
                    box-sizing: border-box;
                    &::selection {
                        background: none;
                    }
                }
            
                + .tgl-btn {
                    outline: 0;
                    display: block;
                    width: 2em;
                    height: 2em;
                    border-radius: 5px;
                    position: relative;
                    cursor: pointer;
                    user-select: none;
                    &:after,
                    &:before {
                        position: relative;
                        display: block;
                        content: "";
                        width: 50%;
                        height: 100%;
                    }
                
                    &:after {
                        left: 0;
                    }
                
                    &:before {
                        display: none;
                    }
                }
            
                &:checked + .tgl-btn:after {
                    left: 50%;
                }
            }

            .tgl-skewed {
                + .tgl-btn {
                    overflow: hidden;
                    transform: skew(-10deg);
                    backface-visibility: hidden;
                    transition: all .2s ease;
                    font-family: sans-serif;
                    background: #d98986;
                    &:after,
                    &:before {
                        transform: skew(10deg);
                        display: inline-block;
                        transition: all .2s ease;
                        width: 100%;
                        text-align: center;
                        position: absolute;
                        line-height: 2em;
                        font-weight: bold;
                        color: #fff;
                        text-shadow: 0 1px 0 rgba(0,0,0,.4);
                    }
                
                    &:after {
                        left: 100%;
                        content: attr(data-tg-on);
                    }
                
                    &:before {
                        left: 0;
                        content: attr(data-tg-off);
                    }
                
                    &:active {
                        background: #888;
                        &:before {
                            left: -10%;
                        }
                    }
                }
            
                &:checked + .tgl-btn {
                background: #86d993;
                &:before {
                left: -100%;
                }

                &:after {
                left: 0;
                }

                &:active:after {
                left: 10%;
                }
                }
            }
        </style>
    </head>
    <body>
        <ul class="tg-list">
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb1" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="M" data-tg-on="M" for="cb1"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb2" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="T" data-tg-on="T" for="cb2"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb3" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="W" data-tg-on="W" for="cb3"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb4" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="T" data-tg-on="T" for="cb4"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb5" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="F" data-tg-on="F" for="cb5"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb6" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="S" data-tg-on="S" for="cb6"></label>
  </li>
  <li class="tg-list-item">
    <input class="tgl tgl-skewed" id="cb7" type="checkbox"/>
    <label class="tgl-btn" data-tg-off="S" data-tg-on="S" for="cb7"></label>
  </li>
</ul>
    </body>
</html>
